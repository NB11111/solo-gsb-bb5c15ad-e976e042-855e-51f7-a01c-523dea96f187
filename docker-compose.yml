services:
  language-negotiator:
    build: .
    image: language-negotiator:1.0.0
    container_name: language-negotiator
    ports:
      # Host port : container port — change the left side if 8000 is taken.
      - "${HOST_PORT:-8000}:8000"
    environment:
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
